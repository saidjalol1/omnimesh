[package]
name = "omnimesh-py"
version = "1.0.1"
edition = "2021"
description = "Python bindings for OMNI-MESH mesh networking middleware"
license = "MIT"

[lib]
name = "omnimesh"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38"] }
omnimesh = { path = "../.." }
hex = "0.4"

[features]
default = ["pyo3/extension-module"]
