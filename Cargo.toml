[package]
name = "omnimesh"
version = "1.0.1"
edition = "2024"
authors = ["Saidjalol <saidjalolturakhujayev@gmail.com>"]
description = "Zero-allocation mesh networking middleware for autonomous robot fleets, edge-AI swarms, and multi-agent systems"
license = "MIT"
repository = "https://github.com/saidjalol1/omnimesh"
homepage = "https://github.com/saidjalol1/omnimesh"
documentation = "https://docs.rs/omnimesh"
readme = "README.md"
keywords = ["robotics", "mesh-networking", "edge-ai", "p2p", "iot"]
categories = ["network-programming", "embedded", "science::robotics"]
rust-version = "1.85"

[workspace]
members = [".", "bindings/python"]
resolver = "2"

[[bin]]
name = "omnimesh"
path = "src/main.rs"
required-features = ["std"]

[[bin]]
name = "omnimesh-cli"
path = "src/bin/omnimesh-cli.rs"
required-features = ["std"]

[dependencies]
tokio = { version = "1.0", features = ["full"], optional = true }
quinn = { version = "0.11", optional = true }
rcgen = { version = "0.13", optional = true }
rustls = { version = "0.23", features = ["std", "ring"], optional = true }
rustls-pemfile = { version = "2.0", optional = true }
rustls-pki-types = { version = "1.0", optional = true }
flate2 = { version = "1.0", optional = true }
sled = { version = "0.34", optional = true }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
blake3 = { version = "1.5", default-features = false }
rand_core = { version = "0.6", default-features = false }
prost = { version = "0.13", default-features = false, features = ["prost-derive"] }
toml = { version = "0.8", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
clap = { version = "4.4", features = ["derive"], optional = true }
ollama-rs = { version = "0.1.9", optional = true }
reqwest = { version = "0.11", features = ["blocking", "json"], optional = true }
serde_json = { version = "1.0", optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
prometheus = { version = "0.13", optional = true }
lazy_static = { version = "1.4", optional = true }
core_affinity = { version = "0.8", optional = true }
thread-priority = { version = "1.1", optional = true }
ctrlc = { version = "3.4", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "omnimesh_benchmarks"
harness = false

[[example]]
name = "ollama_group_chat"
required-features = ["ollama"]

[features]
default = ["std"]
std = [
    "tokio",
    "quinn",
    "rcgen",
    "rustls",
    "rustls-pemfile",
    "rustls-pki-types",
    "flate2",
    "sled",
    "toml",
    "serde/std",
    "serde_json",
    "clap",
    "ed25519-dalek/std",
    "blake3/std",
    "rand_core/std",
    "prometheus",
    "lazy_static",
    "ctrlc",
    "core_affinity",
    "thread-priority"
]
ollama = ["ollama-rs", "reqwest"]
